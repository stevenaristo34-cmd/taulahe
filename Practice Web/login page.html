<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Pastikan nama file CSS ini sesuai dengan file CSS login kamu -->
    <link rel="stylesheet" href="stylelogin1.css"> 
</head>
<body>

    <div class="login">
        <h1>Welcome Back</h1>
        <p>Login to your account</p>

        <!-- Form ditambahkan di sini, mengarah ke beranda.html -->
        <form action="beranda.html">
            <input type="email" placeholder="Email address" required>
            <input type="password" placeholder="Password" required>

            <!-- Tombol sekarang berada di dalam form dan akan memicu perpindahan halaman -->
            <button type="submit">Login</button>
        </form>

        <a href="#">Forgot password?</a>
        <span>Don't have an account? <a href="#">Sign Up</a></span>
    </div>
    
</body>
</html>
